name: dev Deploy

on:
  push:
    branches:
      - main
    paths:
      - "backend/**"
      - ".github/workflows/backend-cloud-run.yml"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: backend-cloud-run-${{ github.ref }}
  cancel-in-progress: true

env:
  GCP_PROJECT_ID: heshajoy-81412
  GCP_PROJECT_NUMBER: "1006870418817"
  GCP_REGION: europe-west1
  GCP_SERVICE_ACCOUNT_EMAIL: github-deploy@heshajoy-81412.iam.gserviceaccount.com
  GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL: 1006870418817-compute@developer.gserviceaccount.com

  ARTIFACT_REGISTRY_REPOSITORY: heshajoy
  CLOUD_RUN_SERVICE: heshajoy
  IMAGE_NAME: heshajoy
  IMAGE_TAG: latest
  CLOUD_RUN_PORT: "8080"
  CLOUD_RUN_CPU: "1"
  CLOUD_RUN_MEMORY: 1Gi
  CLOUD_RUN_MAX_INSTANCES: "2"
  CLOUD_RUN_ALLOW_UNAUTHENTICATED: "true"

  BACKEND_CONTEXT: backend
  BACKEND_DOCKERFILE: backend/Dockerfile
  PYTHON_VERSION: "3.12"
  BACKEND_TEST_DATABASE_URL: sqlite:////tmp/heshajoy-cloud-run-test.db
  BACKEND_TEST_UPLOAD_DIR: /tmp/heshajoy-cloud-run-test-uploads

  SUPABASE_DB_HOST: db.nsxgesasnbkqpkwjgurs.supabase.co
  SUPABASE_DB_PORT: "5432"
  SUPABASE_DB_NAME: postgres
  SUPABASE_DB_USER: postgres
  SUPABASE_PROJECT_REF: nsxgesasnbkqpkwjgurs
  SUPABASE_POOLER_HOST: aws-0-eu-west-1.pooler.supabase.com
  SUPABASE_POOLER_PORT: "5432"

  APP_ENV: production
  APP_TIMEZONE: Africa/Tunis
  CORS_ORIGINS: '["https://heshajoy-81412.web.app","https://heshajoy-81412.firebaseapp.com","http://localhost:3000","http://127.0.0.1:3000","http://localhost:3002","http://127.0.0.1:3002","http://localhost:5173","http://127.0.0.1:5173"]'
  DB_WAIT_ATTEMPTS: "30"
  DB_WAIT_SECONDS: "2"
  MAX_UPLOAD_SIZE_MB: "10"
  EXPO_PUSH_API_URL: https://exp.host/--/api/v2/push/send
  EXPO_PUSH_ENABLED: "true"
  EXPO_PUSH_TIMEOUT_SECONDS: "10"
  FCM_WEB_ENABLED: "true"
  FCM_WEB_TIMEOUT_SECONDS: "10"
  FIREBASE_PROJECT_ID: heshajoy-81412
  FRONTEND_APP_URL: https://heshajoy-81412.web.app
  SEED_ADMIN_EMAIL: admin@example.com
  SEED_ON_STARTUP: "false"
  SYNC_HICHA_HIGH_WORKBOOK: "true"
  HICHA_HIGH_WORKBOOK_PATH: data/hicha-high-preventive-maintenance.xlsx

jobs:
  build:
    name: Cloud Run Deployment
    runs-on: ubuntu-latest
    defaults:
      run:
        shell: bash

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install backend dependencies
        working-directory: backend
        run: |
          set -euo pipefail
          python -m pip install --upgrade pip
          pip install -e ".[dev]"

      - name: Prepare deployment variables
        env:
          GCP_SERVICE_ACCOUNT_CREDENTIALS: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY || secrets.GCP_SERVICE_ACCOUNT }}
          DATABASE_URL_SECRET: ${{ secrets.DATABASE_URL }}
          SUPABASE_DB_PASSWORD: ${{ secrets.SUPABASE_DB_PASSWORD }}
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
        run: |
          set -euo pipefail

          python3 - <<'PY'
          import json
          import os
          import sys
          from urllib.parse import quote, urlparse

          errors = []
          required_secrets = {
              "GCP_SERVICE_ACCOUNT_CREDENTIALS": "GCP_SERVICE_ACCOUNT_KEY (or legacy GCP_SERVICE_ACCOUNT)",
              "JWT_SECRET": "JWT_SECRET",
              "SEED_ADMIN_PASSWORD": "SEED_ADMIN_PASSWORD",
          }

          for env_name, secret_name in required_secrets.items():
              if not os.environ.get(env_name):
                  errors.append(
                      f"Missing GitHub Actions secret: {secret_name}. "
                      "Add it in GitHub repository Settings > Secrets and variables > Actions > Secrets."
                  )

          if errors:
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)

          try:
              credentials = json.loads(os.environ["GCP_SERVICE_ACCOUNT_CREDENTIALS"])
          except json.JSONDecodeError as exc:
              print(f"::error::GCP service account secret must contain the raw JSON key. JSON parse failed: {exc}")
              sys.exit(1)

          expected_email = os.environ["GCP_SERVICE_ACCOUNT_EMAIL"]
          expected_project = os.environ["GCP_PROJECT_ID"]
          if credentials.get("client_email") != expected_email:
              errors.append(
                  f"GCP service account client_email must be {expected_email}, got {credentials.get('client_email')!r}."
              )
          if credentials.get("project_id") != expected_project:
              errors.append(
                  f"GCP service account project_id must be {expected_project}, got {credentials.get('project_id')!r}."
              )

          def is_local_database_url(value: str) -> bool:
              return urlparse(value).hostname in {"localhost", "127.0.0.1", "0.0.0.0", "postgres"}

          def is_direct_supabase_url(value: str) -> bool:
              return urlparse(value).hostname == os.environ["SUPABASE_DB_HOST"]

          def validate_database_url(value: str) -> str | None:
              parsed = urlparse(value)
              if not parsed.hostname:
                  return "DATABASE_URL must include a database host."
              if not parsed.scheme.startswith("postgresql"):
                  return "DATABASE_URL must use a PostgreSQL SQLAlchemy URL such as postgresql+psycopg://..."
              if "YOUR_" in value or "<" in value or ">" in value:
                  return "DATABASE_URL still contains a placeholder. Replace it with the real deployed database URL."
              if is_local_database_url(value):
                  return (
                      f"Cloud Run DATABASE_URL resolved to a local host ({parsed.hostname}). "
                      "Set SUPABASE_DB_PASSWORD or replace DATABASE_URL with the deployed database URL."
                  )
              if is_direct_supabase_url(value):
                  return (
                      "Cloud Run cannot reach the direct Supabase database host reliably because it resolves "
                      "to IPv6 only. Use SUPABASE_DB_PASSWORD so CI builds the Session Pooler URL, or set "
                      "DATABASE_URL to the Supabase pooler connection string."
                  )
              return None

          database_url_secret = os.environ.get("DATABASE_URL_SECRET", "")
          supabase_password = os.environ.get("SUPABASE_DB_PASSWORD", "")

          if database_url_secret and not is_local_database_url(database_url_secret) and not is_direct_supabase_url(database_url_secret):
              database_url = database_url_secret
              database_url_source = "DATABASE_URL secret"
          elif supabase_password:
              print("::add-mask::" + supabase_password)
              database_url = (
                  "postgresql+psycopg://"
                  f"{os.environ['SUPABASE_DB_USER']}.{os.environ['SUPABASE_PROJECT_REF']}:"
                  f"{quote(supabase_password, safe='')}"
                  f"@{os.environ['SUPABASE_POOLER_HOST']}:{os.environ['SUPABASE_POOLER_PORT']}"
                  f"/{os.environ['SUPABASE_DB_NAME']}?sslmode=require"
              )
              database_url_source = "SUPABASE_DB_PASSWORD secret with static Supabase Session Pooler host"
              if database_url_secret and (is_local_database_url(database_url_secret) or is_direct_supabase_url(database_url_secret)):
                  print(
                      "::warning::Ignoring the local/direct DATABASE_URL secret and building DATABASE_URL "
                      "from SUPABASE_DB_PASSWORD plus static Supabase Session Pooler settings."
                  )
          else:
              database_url = database_url_secret
              database_url_source = "DATABASE_URL secret"

          database_error = validate_database_url(database_url) if database_url else (
              "Set SUPABASE_DB_PASSWORD, or set DATABASE_URL to the deployed PostgreSQL URL."
          )
          if database_error:
              errors.append(database_error)

          if errors:
              for error in errors:
                  print(f"::error::{error}")
              sys.exit(1)

          registry_host = f"{os.environ['GCP_REGION']}-docker.pkg.dev"
          repository_path = f"{registry_host}/{os.environ['GCP_PROJECT_ID']}/{os.environ['ARTIFACT_REGISTRY_REPOSITORY']}"
          image_uri = f"{repository_path}/{os.environ['IMAGE_NAME']}:{os.environ['IMAGE_TAG']}"
          auth_flag = "--allow-unauthenticated" if os.environ["CLOUD_RUN_ALLOW_UNAUTHENTICATED"] == "true" else "--no-allow-unauthenticated"

          print("::add-mask::" + database_url)
          with open(os.environ["GITHUB_ENV"], "a", encoding="utf-8") as github_env:
              github_env.write(f"REGISTRY_HOST={registry_host}\n")
              github_env.write(f"REPOSITORY_PATH={repository_path}\n")
              github_env.write(f"IMAGE_URI={image_uri}\n")
              github_env.write(f"AUTH_FLAG={auth_flag}\n")
              github_env.write(f"DATABASE_URL={database_url}\n")

          print(f"Image: {image_uri}")
          print(f"Cloud Run DATABASE_URL source: {database_url_source}; host: {urlparse(database_url).hostname}")
          PY

      - id: auth
        name: Authenticate to Google Cloud
        uses: google-github-actions/auth@v3
        with:
          credentials_json: ${{ secrets.GCP_SERVICE_ACCOUNT_KEY || secrets.GCP_SERVICE_ACCOUNT }}

      - name: Set up Cloud SDK
        uses: google-github-actions/setup-gcloud@v3

      - name: Ensure Artifact Registry repository
        run: |
          set -euo pipefail

          if output="$(gcloud artifacts repositories describe "${ARTIFACT_REGISTRY_REPOSITORY}" \
            --project "${GCP_PROJECT_ID}" \
            --location "${GCP_REGION}" 2>&1)"; then
            echo "Artifact Registry repository exists: ${REPOSITORY_PATH}"
            exit 0
          fi

          if ! grep -q "NOT_FOUND" <<< "${output}"; then
            echo "::error::Unable to verify Artifact Registry repository ${REPOSITORY_PATH}."
            echo "${output}"
            if grep -q "PERMISSION_DENIED" <<< "${output}"; then
              echo "Grant the deploy service account Artifact Registry access:"
              echo "gcloud projects add-iam-policy-binding ${GCP_PROJECT_ID} --member serviceAccount:${GCP_SERVICE_ACCOUNT_EMAIL} --role roles/artifactregistry.admin"
            fi
            exit 1
          fi

          echo "Creating Artifact Registry repository: ${REPOSITORY_PATH}"
          if ! gcloud artifacts repositories create "${ARTIFACT_REGISTRY_REPOSITORY}" \
            --project "${GCP_PROJECT_ID}" \
            --location "${GCP_REGION}" \
            --repository-format docker \
            --description "HeshaJoy Docker images"; then
            echo "::error::Failed to create Artifact Registry repository ${REPOSITORY_PATH}."
            echo "Create it manually with:"
            echo "gcloud artifacts repositories create ${ARTIFACT_REGISTRY_REPOSITORY} --project ${GCP_PROJECT_ID} --location ${GCP_REGION} --repository-format docker --description 'HeshaJoy Docker images'"
            exit 1
          fi

      - name: Configure Docker
        run: gcloud auth configure-docker "${REGISTRY_HOST}" --quiet

      - name: Build
        run: docker build -t "${IMAGE_URI}" -f "${BACKEND_DOCKERFILE}" "${BACKEND_CONTEXT}"

        run: |
          set -euo pipefail
          trivy image \
            --severity HIGH,CRITICAL \
            --format table \
            --scanners vuln \
            "${IMAGE_URI}" | tee output-report.txt

      - name: Push
        run: docker push "${IMAGE_URI}"

      - name: Deploy to Cloud Run
        env:
          JWT_SECRET: ${{ secrets.JWT_SECRET }}
          SEED_ADMIN_PASSWORD: ${{ secrets.SEED_ADMIN_PASSWORD }}
          EXPO_PUSH_ACCESS_TOKEN: ${{ secrets.EXPO_PUSH_ACCESS_TOKEN }}
        run: |
          set -euo pipefail

          env_vars="^@@^APP_ENV=${APP_ENV}@@APP_TIMEZONE=${APP_TIMEZONE}@@CORS_ORIGINS=${CORS_ORIGINS}@@DB_WAIT_ATTEMPTS=${DB_WAIT_ATTEMPTS}@@DB_WAIT_SECONDS=${DB_WAIT_SECONDS}@@MAX_UPLOAD_SIZE_MB=${MAX_UPLOAD_SIZE_MB}@@EXPO_PUSH_API_URL=${EXPO_PUSH_API_URL}@@EXPO_PUSH_ENABLED=${EXPO_PUSH_ENABLED}@@EXPO_PUSH_TIMEOUT_SECONDS=${EXPO_PUSH_TIMEOUT_SECONDS}@@EXPO_PUSH_ACCESS_TOKEN=${EXPO_PUSH_ACCESS_TOKEN}@@FCM_WEB_ENABLED=${FCM_WEB_ENABLED}@@FCM_WEB_TIMEOUT_SECONDS=${FCM_WEB_TIMEOUT_SECONDS}@@FIREBASE_PROJECT_ID=${FIREBASE_PROJECT_ID}@@FRONTEND_APP_URL=${FRONTEND_APP_URL}@@SEED_ADMIN_EMAIL=${SEED_ADMIN_EMAIL}@@SEED_ON_STARTUP=${SEED_ON_STARTUP}@@DATABASE_URL=${DATABASE_URL}@@JWT_SECRET=${JWT_SECRET}@@SEED_ADMIN_PASSWORD=${SEED_ADMIN_PASSWORD}"

          if ! gcloud run deploy "${CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --platform managed \
            --image "${IMAGE_URI}" \
            --port "${CLOUD_RUN_PORT}" \
            --cpu "${CLOUD_RUN_CPU}" \
            --memory "${CLOUD_RUN_MEMORY}" \
            --max-instances "${CLOUD_RUN_MAX_INSTANCES}" \
            "${AUTH_FLAG}" \
            --set-env-vars "${env_vars}" \
            --quiet; then
            echo "::error::Cloud Run deployment failed."
            echo "If the error is PERMISSION_DENIED for run.services.get/create/update, grant Cloud Run admin:"
            echo "gcloud projects add-iam-policy-binding ${GCP_PROJECT_ID} --member serviceAccount:${GCP_SERVICE_ACCOUNT_EMAIL} --role roles/run.admin"
            echo "If the error is iam.serviceAccounts.actAs, grant service-account-user on the runtime service account:"
            echo "gcloud iam service-accounts add-iam-policy-binding ${GCP_RUNTIME_SERVICE_ACCOUNT_EMAIL} --project ${GCP_PROJECT_ID} --member serviceAccount:${GCP_SERVICE_ACCOUNT_EMAIL} --role roles/iam.serviceAccountUser"
            exit 1
          fi

        if: ${{ env.CLOUD_RUN_ALLOW_UNAUTHENTICATED == 'true' }}
        run: |
          set -euo pipefail

          service_url="$(gcloud run services describe "${CLOUD_RUN_SERVICE}" \
            --project "${GCP_PROJECT_ID}" \
            --region "${GCP_REGION}" \
            --format "value(status.url)")"

          if [ -z "${service_url}" ]; then
            echo "::error::Cloud Run service URL is empty."
            exit 1
          fi

          echo "Cloud Run URL: ${service_url}"
          curl --fail --silent --show-error --retry 5 --retry-delay 5 --retry-all-errors "${service_url}/health"